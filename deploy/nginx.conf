# aa.example.com AA 账本 —— Node 服务在 127.0.0.1:8792（systemd: aa.service，代码 /srv/aa/app）
limit_req_zone $binary_remote_addr zone=aa_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aa_api:10m   rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name aa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aa.example.com;

    ssl_certificate     /etc/letsencrypt/live/aa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aa.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # 分享链接里带密钥，绝不能通过 Referer 泄露给别的网站
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/invite/trips {
        limit_req zone=aa_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8792;
    }
    location = /api/login {
        limit_req zone=aa_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8792;
    }
    # 截图、收款码上传
    location ~ ^/api/t/[A-Za-z0-9_-]+/(expenses/\d+/images|paycode/\d+/\w+)$ {
        client_max_body_size 7m;
        limit_req zone=aa_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8792;
    }
    location /api/ {
        limit_req zone=aa_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8792;
    }
    location / {
        proxy_pass http://127.0.0.1:8792;
    }
}
